<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Dr. Vision Local Viewer</title>
<style>
  :root{ --bg:#0e1116; --panel:#171c24; --panel2:#1f2630; --line:#2a333f; --txt:#d7dee8; --mut:#8a97a6; --accent:#4aa3ff; --ok:#43c08a; --warn:#e0b341; --rec:#c0392b; }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
  .hide{display:none!important}
  /* header */
  header{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;white-space:nowrap}
  header .sp{flex:1}
  #status{font-size:12px;color:var(--mut);max-width:52vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
  .pill{font-size:12px;color:var(--mut);background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:3px 10px}
  #liveBadge{background:var(--rec);color:#fff;border-color:var(--rec)}
  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
  .seg button{background:none;border:0;color:var(--mut);padding:10px 15px;cursor:pointer;font:inherit}
  .seg button.on{background:var(--accent);color:#061320;font-weight:600}
  /* camera picker bar */
  .camerabar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  .camerabar select{flex:1 1 150px;min-width:140px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:10px;font:inherit}
  .camerabar .btn{flex:none;white-space:nowrap;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer}
  .camerabar .btn:active{border-color:var(--accent)}
  /* tabs */
  .tabs{display:flex;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
  .tabs button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:12px;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
  .tabs button.on{background:var(--accent);color:#061320;border-color:var(--accent)}
  /* shared video stage */
  .stage{background:#000}
  .view{display:flex;flex-direction:column;gap:10px;padding:10px;background:#000}
  .lens{position:relative;width:100%;aspect-ratio:16/9;background:#06080c;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .lens canvas{max-width:100%;max-height:100%;cursor:grab;touch-action:none}
  .lens .tag{position:absolute;top:8px;left:8px;background:#000a;border:1px solid var(--line);border-radius:6px;padding:3px 10px;font-size:13px;color:var(--mut)}
  .lens .z{position:absolute;bottom:8px;right:8px;background:#000a;border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:11px;color:var(--mut)}
  .lens .rot{position:absolute;bottom:8px;left:8px;background:#000a;border:1px solid var(--line);border-radius:6px;padding:5px 12px;font-size:16px;color:var(--txt);cursor:pointer;line-height:1}
  .lens .rot:active{border-color:var(--accent)}
  /* shared video tools (apply in both tabs) */
  .vtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:var(--panel);border-top:1px solid var(--line);border-bottom:6px solid var(--bg)}
  .ic{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:10px 14px;cursor:pointer;font:inherit;white-space:nowrap}
  .ic:active{border-color:var(--accent)}
  /* per-tab panels */
  .panel{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px}
  #live{font-weight:700;font-size:16px;padding:13px 20px;border-radius:10px}
  #live.on{background:var(--rec);border-color:var(--rec);color:#fff}
  .recctl{display:flex;gap:10px;align-items:center;width:100%}
  .recctl .lbl{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.7px}
  .recctl select{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:11px;font:inherit}
  .tlwrap{width:100%}
  #timeline{position:relative;height:48px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;user-select:none}
  #tlticks{position:absolute;inset:0;pointer-events:none}
  #tlticks .tick{position:absolute;top:0;bottom:0;border-left:1px solid #ffffff10}
  #tlticks .tl{position:absolute;bottom:2px;font-size:9px;color:var(--mut);transform:translateX(2px)}
  #tlblocks{position:absolute;left:0;right:0;top:11px;height:26px}
  #tlblocks .blk{position:absolute;top:0;height:100%;border-radius:2px;min-width:1px}
  .blk.continuous{background:var(--ok)} .blk.motion{background:var(--warn)} .blk.alarm{background:#e05a5a} .blk.event{background:var(--accent)}
  .blk:active{filter:brightness(1.4)}
  #tlhead{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 6px #fff9;pointer-events:none}
  #tltip{position:absolute;top:-24px;transform:translateX(-50%);background:#000d;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px;white-space:nowrap;pointer-events:none}
  .controls{display:flex;align-items:center;gap:10px;width:100%}
  .controls input[type=range]{flex:1;height:30px}
  #tcur,#tdur{font-variant-numeric:tabular-nums;font-size:13px}
  #clipname{font-size:12px;color:var(--mut)}
  .reclist{width:100%}
  .reclist h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin:4px 0 6px}
  #segs{max-height:42vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
  .segrow{display:flex;gap:10px;align-items:center;padding:12px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
  .segrow:last-child{border-bottom:0}
  .segrow.on{background:var(--panel2)}
  .segrow .t{width:9px;height:9px;border-radius:50%;flex:none}
  .t.continuous{background:var(--ok)} .t.motion{background:var(--warn)} .t.alarm{background:#e05a5a} .t.event{background:var(--accent)}
  .segrow .meta{flex:1;min-width:0}
  .segrow .time{font-variant-numeric:tabular-nums;font-size:15px} .segrow .sub{font-size:12px;color:var(--mut)}
  /* loading overlay */
  .load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:#000b;color:var(--mut);z-index:5;text-align:center;padding:12px}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  video#src{display:none}
  /* camera controls drawer */
  .drawer{position:fixed;top:0;right:0;height:100%;width:100%;max-width:100%;background:var(--panel);border-left:1px solid var(--line);z-index:40;display:flex;flex-direction:column;box-shadow:-10px 0 28px #000a}
  .drawer.hide{display:none}
  .dhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
  .dhead b{font-size:16px}
  .dbody{flex:1;overflow:auto;padding:8px 16px 28px}
  .dsect h3{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin:16px 0 8px}
  .ctrlrow{display:flex;align-items:center;gap:10px;margin:9px 0;min-height:30px}
  .ctrlrow label{flex:1;font-size:14px}
  .ctrlrow .val{font-size:12px;color:var(--mut);min-width:26px;text-align:right;font-variant-numeric:tabular-nums}
  .ctrlrow select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:7px 8px;font:inherit;width:160px}
  .ctrlrow input[type=range]{width:150px;height:28px}
  .switch{width:46px;height:26px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);position:relative;cursor:pointer;flex:none}
  .switch.on{background:var(--accent);border-color:var(--accent)}
  .switch i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
  .switch.on i{left:22px}
  #ptzpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:260px;margin:8px auto}
  #ptzpad button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:16px 0;font-size:18px;cursor:pointer}
  #ptzpad button.home{background:var(--accent);color:#061320}
  #ptzpad button.sp{visibility:hidden}
  .pbtn{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:12px;cursor:pointer;margin-top:10px;font:inherit}
  .note{font-size:12px;color:var(--mut);margin-top:10px;line-height:1.5}
  /* on-video controls for fullscreen (translucent) */
  .fsctrl{position:absolute;inset:0;z-index:9;pointer-events:none}
  .fsctrl.hide{display:none}
  .fsctrl>*{pointer-events:auto}
  /* on-lens translucent pan/tilt — thin chevrons at the 4 edge centers of the motorised (bottom) lens.
     LIVE only; shows in normal + fullscreen. No boxes, no home button; 46px invisible tap targets. */
  .lensptz{position:absolute;inset:0;z-index:7;pointer-events:none}
  .lensptz.hide{display:none!important}
  .lensptz .pz{position:absolute;width:46px;height:46px;padding:0;margin:0;background:none;border:0;cursor:pointer;pointer-events:auto;display:flex;align-items:center;justify-content:center;opacity:.55;transition:opacity .15s}
  .lensptz .pz:active{opacity:1}
  .lensptz .pz .chev{width:15px;height:15px;border-right:2.6px solid #fff;border-bottom:2.6px solid #fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.85))}
  .lensptz .up{top:1px;left:50%;transform:translateX(-50%)}
  .lensptz .down{bottom:1px;left:50%;transform:translateX(-50%)}
  .lensptz .left{left:1px;top:50%;transform:translateY(-50%)}
  .lensptz .right{right:1px;top:50%;transform:translateY(-50%)}
  .lensptz .up .chev{transform:rotate(-135deg);margin-top:5px}
  .lensptz .down .chev{transform:rotate(45deg);margin-bottom:5px}
  .lensptz .left .chev{transform:rotate(135deg);margin-left:5px}
  .lensptz .right .chev{transform:rotate(-45deg);margin-right:5px}
  .fsptz{display:none!important} /* replaced by the on-lens pad, which also shows in fullscreen */
  .fsptz-legacy{position:absolute;left:18px;bottom:18px;display:grid;grid-template-columns:repeat(3,52px);grid-auto-rows:52px;gap:7px;opacity:.65;transition:opacity .2s}
  .fsptz button{background:#000a;border:1px solid #ffffff55;color:#fff;border-radius:10px;font-size:18px;cursor:pointer;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
  .fsptz button.sp{visibility:hidden;border:0;background:none}
  .fsptz button[data-fshome]{background:#4aa3ffcc;color:#061320;border-color:transparent}
  .fsbar{position:absolute;right:18px;bottom:18px;display:flex;gap:8px;opacity:.65;transition:opacity .2s;flex-wrap:wrap;justify-content:flex-end;max-width:62vw}
  .fsbar button{min-width:52px;height:52px;background:#000a;border:1px solid #ffffff55;color:#fff;border-radius:10px;font-size:16px;cursor:pointer;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
  .fsbar button.on{background:var(--rec);border-color:transparent}
  /* CSS-fullscreen fallback (when the WebView Fullscreen API is unavailable) */
  body.cssfs #view{position:fixed;inset:0;z-index:50;background:#000;padding:6px;gap:6px}
  body.cssfs .lens{aspect-ratio:auto;height:100%;flex:1;min-height:0}
  /* native fullscreen: the view element fills the screen */
  #view:fullscreen{background:#000;padding:6px;gap:6px}
  #view:fullscreen .lens{aspect-ratio:auto;height:100%;flex:1;min-height:0}
  #view:-webkit-full-screen{background:#000}
  #view:-webkit-full-screen .lens{aspect-ratio:auto;height:100%;flex:1;min-height:0}

  /* wider screens: lenses side by side, centered column */
  @media (min-width:900px){
    .view{flex-direction:row}
    .lens{flex:1;width:auto;aspect-ratio:auto;min-height:48vh}
    body:not(.cssfs){max-width:1100px;margin:0 auto;width:100%;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  }
</style>
</head>
<body>
<header>
  <h1>Dr. Vision</h1>
  <span class="pill hide" id="liveBadge">● LIVE</span>
  <div class="sp"></div>
  <span id="status">ready</span>
  <!-- kept hidden so existing logic has its hooks -->
  <div class="seg hide" id="mode"><button data-m="local" class="on">Local</button><button data-m="server">Server</button></div>
  <span class="pill hide" id="camPill">no camera</span>
  <span class="pill hide" id="share">share</span>
  <span id="vinfo" class="hide"></span>
</header>

<div class="camerabar">
  <select id="cams"><option value="">Searching…</option></select>
  <button class="btn" id="addCam" title="Add a new camera over Bluetooth">＋ Add</button>
  <button class="btn" id="rescan" title="Rescan the hotspot for cameras">⟳ Rescan</button>
</div>

<div class="tabs" id="tabs">
  <button data-tab="live" class="on">● Live view</button>
  <button data-tab="rec">▦ Recordings</button>
</div>

<div class="stage" id="stage">
  <div class="view" id="view">
    <div class="lens" id="lensTop"><span class="tag">Lens 1 (top)</span><canvas></canvas><button class="rot" data-k="top" title="Rotate this view 90°">⟳</button><span class="z">1.0×</span></div>
    <div class="lens" id="lensBottom"><span class="tag">Lens 2 (bottom)</span><canvas></canvas><button class="rot" data-k="bottom" title="Rotate this view 90°">⟳</button><span class="z">1.0×</span>
      <div class="lensptz hide" id="lensPtz" title="Pan / tilt (live)">
        <button class="pz up" data-dir="up" aria-label="Tilt up"><i class="chev"></i></button>
        <button class="pz down" data-dir="down" aria-label="Tilt down"><i class="chev"></i></button>
        <button class="pz left" data-dir="left" aria-label="Pan left"><i class="chev"></i></button>
        <button class="pz right" data-dir="right" aria-label="Pan right"><i class="chev"></i></button>
      </div>
    </div>
    <div class="load hide" id="load"><div class="spin"></div><div id="loadtxt">Loading…</div></div>
    <div id="fsctrl" class="fsctrl hide">
      <div class="fsptz" title="Pan / tilt">
        <button class="sp"></button><button data-dir="up">▲</button><button class="sp"></button>
        <button data-dir="left">◀</button><button data-fshome="1" title="Home">⌂</button><button data-dir="right">▶</button>
        <button class="sp"></button><button data-dir="down">▼</button><button class="sp"></button>
      </div>
      <div class="fsbar">
        <button id="fsPlay" title="Play / pause">▶</button>
        <button id="fsMute" title="Mute">🔇</button>
        <button id="fsRotT" title="Rotate top lens">⟳¹</button>
        <button id="fsRotB" title="Rotate bottom lens">⟳²</button>
        <button id="fsLive" title="Live">●</button>
        <button id="fsExit" title="Exit fullscreen">⤢</button>
      </div>
    </div>
  </div>
  <div class="vtools">
    <div class="seg" id="layout">
      <button data-l="both" class="on">Both</button>
      <button data-l="top">Top</button>
      <button data-l="bottom">Bottom</button>
    </div>
    <button class="ic" id="resetZoom">Reset zoom</button>
    <button class="ic" id="fs">⛶ Fullscreen</button>
    <button class="ic" id="mute">🔇</button>
    <button class="ic" id="ctrlBtn">⚙ Controls</button>
  </div>
</div>

<!-- LIVE tab -->
<div class="panel" id="panel-live">
  <button class="ic" id="live">● Start live</button>
  <div class="seg" id="quality">
    <button data-q="sd" class="on">SD</button>
    <button data-q="hd">HD</button>
  </div>
</div>

<!-- RECORDINGS tab -->
<div class="panel hide" id="panel-rec">
  <div class="recctl">
    <span class="lbl">Day</span>
    <select id="days"><option value="">—</option></select>
  </div>
  <div class="tlwrap">
    <div id="timeline" title="Day timeline — tap to play">
      <div id="tlticks"></div>
      <div id="tlblocks"></div>
      <div id="tlhead" class="hide"></div>
      <div id="tltip" class="hide"></div>
    </div>
  </div>
  <div class="controls">
    <button class="ic" id="play">▶</button>
    <span id="tcur">0:00</span>
    <input type="range" id="seek" min="0" max="1000" value="0">
    <span id="tdur">0:00</span>
    <span id="clipname"></span>
  </div>
  <div class="reclist">
    <h2>Recordings</h2>
    <div id="segs"></div>
  </div>
</div>

<div id="drawer" class="drawer hide">
  <div class="dhead"><b>Camera controls</b><button class="ic" id="ctrlClose">✕ Close</button></div>
  <div class="dbody">
    <div class="dsect">
      <h3>Pan / tilt</h3>
      <div id="ptzpad">
        <button class="sp"></button><button data-dir="up" title="Tilt up">▲</button><button class="sp"></button>
        <button data-dir="left" title="Pan left">◀</button><button class="home" id="ptzHome" title="Go to home position">⌂</button><button data-dir="right" title="Pan right">▶</button>
        <button class="sp"></button><button data-dir="down" title="Tilt down">▼</button><button class="sp"></button>
      </div>
      <button class="pbtn" id="ptzRecal">Recalibrate motor</button>
      <div class="note" id="ptznote">Press and hold an arrow to pan/tilt; release to stop. ⌂ returns to the home position.</div>
    </div>
    <div id="settingsHost"><div class="note">Open to read live settings from the camera…</div></div>
  </div>
</div>
<video id="src" crossorigin="anonymous" playsinline></video>
<script src="app.js"></script>
</body>
</html>
